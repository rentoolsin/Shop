<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F7F7F5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121214" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- iOS has no beforeinstallprompt / manifest-driven install — these are
         the only levers Safari respects for "Add to Home Screen" behavior.
         Chromium (Chrome/Edge) deprecated the apple- prefixed tag in favor
         of the standard one below, so both are included: iOS Safari only
         honors the apple- one, Chromium only honors the unprefixed one. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="RenTools" />
    <title>RenTools — Construction Tool &amp; Equipment Rental, Coimbatore</title>
    <meta
      name="description"
      content="Rent construction tools and equipment in Coimbatore. Browse tools, check daily rates, and enquire by call or WhatsApp."
    />
    <meta name="robots" content="index, follow" />
    <!-- Per-route title/description/canonical/og:url are overridden at
         runtime by useDocumentMeta (src/hooks/useDocumentMeta.ts) using
         window.location.origin; the values below are the site-level
         defaults for the root route and as a fallback before that hook
         runs (e.g. for crawlers that don't execute JS). -->
    <link rel="canonical" href="https://rentoolz.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="RenTools" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:url" content="https://rentoolz.vercel.app/" />
    <meta property="og:image" content="https://rentoolz.vercel.app/pwa-512x512.png" />
    <meta name="twitter:card" content="summary" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <!-- LocalBusiness structured data — values sourced from
         src/utils/site-settings.ts (SITE_SETTINGS_DEFAULTS), which the code
         there already documents as the business's real live contact info,
         not placeholders. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "HardwareStore",
        "name": "RenTools",
        "url": "https://rentoolz.vercel.app/",
        "description": "Construction tool and equipment rental in Coimbatore, Tamil Nadu.",
        "image": "https://rentoolz.vercel.app/logo-black.png",
        "telephone": "+919688755349",
        "email": "rentools.in@gmail.com",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Kovilmedu",
          "addressLocality": "Coimbatore",
          "addressRegion": "Tamil Nadu",
          "addressCountry": "IN"
        },
        "priceRange": "₹₹"
      }
    </script>
    <script>
      // Prevent theme flash: resolve light/dark/system before paint.
      (function () {
        try {
          var stored = localStorage.getItem("rentools-theme");
          var mode =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.classList.toggle("dark", mode === "dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-graphite-50 dark:bg-graphite-950">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
